name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "scripts/**"
      - "public/**"
      - "server.js"
      - "lib/**"
      - "package.json"
      - "INSTALLER.md"
      - ".github/workflows/windows-installer.yml"

permissions:
  contents: read

jobs:
  windows-installer:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Compile and test
        shell: powershell
        run: .\scripts\build-installer.ps1 -NoInstallInno
      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LAN-Cam-OBS-Setup-windows-x64
          path: dist/*.exe
          retention-days: 14
          if-no-files-found: error
